name: Release

on:
  push:
    tags:
      - 'zh-v*'
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: terax-windows
            binary_name: terax.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: terax-linux
            binary_name: terax
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: terax-macos
            binary_name: terax
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: terax-macos-arm64
            binary_name: terax

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Terax ${{ github.ref_name }}'
          releaseBody: |
            ## Terax ${{ github.ref_name }}

            Lightweight Terminal-first AI-native dev workspace.

            ### Changes
            - i18n support (English, Simplified Chinese)
            - Runtime language switching
            - All settings panels localized

            ### Download
            See assets below for your platform.
          args: --target ${{ matrix.target }}
          includeUpdater: true
          appId: com.terax.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Terax ${{ github.ref_name }}
          body: |
            ## Terax ${{ github.ref_name }}

            Lightweight Terminal-first AI-native dev workspace.

            ### Changes
            - i18n support (English, Simplified Chinese)
            - Runtime language switching
            - All settings panels localized

            ### Download
            See assets below for your platform.
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}