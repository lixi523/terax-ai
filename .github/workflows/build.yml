name: Build & Release

# Build on every push to main and every PR (compile check).
# Pushing a tag `v*` additionally builds a release and publishes a
# GitHub Release with the Windows installers.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Reads the version from the `packageManager` field (pnpm@11.9.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Empty tagName on non-tag refs => build only, no release created.
      - name: Build app (and publish release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Terax ${{ github.ref_name }}"
          releaseBody: "Download the Windows installer below."
          releaseDraft: false
          # 0.9.0-beta and future pre-releases are marked prerelease;
          # stable tags (no `-`) ship as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target x86_64-pc-windows-msvc
